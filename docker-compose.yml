services:
  users:
    build: .
    container_name: dialisis-users
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - dialisis-network

  postgres:
    image: postgres:16
    container_name: dialisis-users-db
    environment:
      POSTGRES_DB: dialisis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dialisis-network

volumes:
  postgres_data:

networks:
  dialisis-network:
    external: true